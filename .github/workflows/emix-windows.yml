# Emix Windows desktop build.
#
#   - Manual run (Actions > Emix Windows > Run workflow): builds the installers
#     and attaches them to the run as an artifact. Publishes nothing.
#   - Push a tag vX.Y.Z matching packages/desktop/package.json "version":
#     builds and uploads the installers plus the auto-update feed (latest.yml)
#     to a DRAFT GitHub release. Installed apps only see the update after the
#     draft is tested and published by hand (see deploy/README.md).
#
# Unsigned: there is no code-signing certificate, so Windows SmartScreen warns
# on first install. Add signing secrets (never committed) to remove that.
name: Emix Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Pinned to windows-2022: the node-gyp bundled with electron-rebuild cannot
    # detect the VS "18" on windows-latest when compiling uiohook-napi.
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="$(node -p "require('./packages/desktop/package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match desktop version $v"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @backspace/shared build

      - name: Compile desktop TypeScript
        working-directory: packages/desktop
        run: pnpm exec tsc

      - name: Installer license page (AGPL-3.0)
        shell: bash
        run: cp LICENSE packages/desktop/build/license.txt

      # Create the draft once, up front. Otherwise electron-builder's parallel
      # x64/arm64 publishers race and can each create a draft (v1.11.1 did).
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          # "What's new" comes from the reviewed changelog (packages/shared/changelog.json).
          python scripts/changelog.py notes "$v" > "$RUNNER_TEMP/whats-new.md"
          [ -s "$RUNNER_TEMP/whats-new.md" ] || echo "<!-- No published changelog entry for $v: write the notes before publishing. -->" > "$RUNNER_TEMP/whats-new.md"
          python - "$RUNNER_TEMP/whats-new.md" "$v" > "$RUNNER_TEMP/notes.md" <<'PY'
          import sys
          notes, v = open(sys.argv[1], encoding="utf-8").read().strip(), sys.argv[2]
          tpl = open(".github/release-notes.md", encoding="utf-8").read()
          sys.stdout.write(tpl.replace("{{VERSION}}", v).replace("{{WHATS_NEW}}", notes))
          PY
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Emix $v" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installers
        working-directory: packages/desktop
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then publish=always; else publish=never; fi
          pnpm exec electron-builder --win --x64 --arm64 --publish "$publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Electron security fuses
        working-directory: packages/desktop
        shell: bash
        # Same backstop as upstream release.yml: read the fuse wire back out of
        # each packaged binary and fail if scripts/afterPack.js did not flip it.
        run: |
          set -euo pipefail
          esc="$(printf '\033')"; failed=0
          for artifact in dist-electron/win-unpacked/Emix.exe dist-electron/win-arm64-unpacked/Emix.exe; do
            [ -e "$artifact" ] || { echo "::error::missing $artifact"; failed=1; continue; }
            fuses="$(FORCE_COLOR=0 npx --no @electron/fuses read --app "$artifact" 2>&1 | sed -e "s/${esc}\[[0-9;]*m//g")"
            echo "==> $artifact"; echo "$fuses"
            for pair in RunAsNode=Disabled EnableNodeCliInspectArguments=Disabled OnlyLoadAppFromAsar=Enabled; do
              name="${pair%%=*}"; want="${pair#*=}"
              got="$(printf '%s\n' "$fuses" | sed -n -E "s/^[[:space:]]*${name} is ([A-Za-z]+)[[:space:]]*\$/\\1/p")"
              [ "$got" = "$want" ] || { echo "::error::$artifact: $name is '${got:-unreported}', expected $want"; failed=1; }
            done
          done
          exit "$failed"

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emix-windows
          path: |
            packages/desktop/dist-electron/*.exe
            packages/desktop/dist-electron/*.yml
            packages/desktop/dist-electron/*.blockmap
          retention-days: 14
